<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Prints - V3D Creative</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #461D7C 0%, #000000 100%); min-height: 100vh; color: white; }
        nav { background: rgba(0,0,0,0.9); padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid #461D7C; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo img { height: 80px; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; padding: 10px 20px; border-radius: 5px; transition: all 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: #461D7C; color: #FDD023; }

        .hero { text-align: center; padding: 50px 20px 30px; }
        .hero h1 { font-size: 2.8em; color: #FDD023; margin-bottom: 12px; }
        .hero p { font-size: 1.1em; color: rgba(255,255,255,0.75); max-width: 540px; margin: 0 auto; line-height: 1.6; }

        .content { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }

        .loading { text-align: center; padding: 60px; color: #FDD023; font-size: 1.1em; }
        .empty { text-align: center; padding: 60px; color: rgba(255,255,255,0.5); font-size: 1.05em; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

        .card { background: rgba(0,0,0,0.65); border: 2px solid #461D7C; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #6a30b0; }
        .card.sold-out { opacity: 0.55; }
        .card.sold-out:hover { transform: none; }

        .card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: rgba(70,29,124,0.3); display: flex; align-items: center; justify-content: center; font-size: 3em; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-img.placeholder { min-height: 160px; }

        .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .card-name { font-size: 1.15em; font-weight: bold; color: #FDD023; line-height: 1.3; }
        .card-desc { font-size: 0.88em; color: rgba(255,255,255,0.7); line-height: 1.5; flex: 1; }
        .card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
        .card-price { font-size: 1.3em; font-weight: bold; color: #FDD023; }
        .color-pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75em; font-weight: bold; background: rgba(70,29,124,0.5); border: 1px solid #461D7C; color: rgba(255,255,255,0.85); }
        .avail-pill { font-size: 0.78em; color: rgba(255,255,255,0.5); margin-left: auto; }
        .avail-pill.low { color: #ffbb33; }
        .avail-pill.out { color: #ff6b6b; }

        .claim-btn { width: 100%; padding: 12px; background: #461D7C; color: #FDD023; border: 2px solid #FDD023; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }
        .claim-btn:hover:not(:disabled) { background: #FDD023; color: #461D7C; }
        .claim-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: #555; color: #888; background: rgba(255,255,255,0.05); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #0e0e1a; border: 2px solid #461D7C; border-radius: 16px; width: 100%; max-width: 400px; padding: 32px; }
        .modal h2 { color: #FDD023; font-size: 1.4em; margin-bottom: 6px; }
        .modal .item-label { color: rgba(255,255,255,0.65); font-size: 0.9em; margin-bottom: 22px; }
        .modal label { display: block; font-size: 0.8em; color: #FDD023; font-weight: bold; margin-bottom: 6px; }
        .modal input { width: 100%; padding: 11px 13px; background: rgba(255,255,255,0.08); border: 2px solid #461D7C; border-radius: 8px; color: white; font-size: 1em; margin-bottom: 18px; }
        .modal input:focus { outline: none; border-color: #FDD023; }
        .modal-btns { display: flex; gap: 10px; }
        .btn-cancel { flex: 1; padding: 11px; background: transparent; color: #aaa; border: 1px solid #555; border-radius: 8px; cursor: pointer; font-size: 0.95em; }
        .btn-cancel:hover { border-color: #888; color: white; }
        .btn-confirm { flex: 2; padding: 11px; background: #461D7C; color: #FDD023; border: 2px solid #FDD023; border-radius: 8px; font-weight: bold; font-size: 0.95em; cursor: pointer; }
        .btn-confirm:hover { background: #FDD023; color: #461D7C; }
        .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-error { color: #ff6b6b; font-size: 0.82em; margin-bottom: 12px; min-height: 18px; }

        /* Success state */
        .success-box { text-align: center; }
        .success-box .check { font-size: 3em; margin-bottom: 12px; }
        .success-box h2 { color: #6dfc6d; margin-bottom: 8px; }
        .success-box p { color: rgba(255,255,255,0.75); font-size: 0.92em; line-height: 1.6; margin-bottom: 20px; }
        .venmo-block { background: linear-gradient(135deg, #461D7C, #FDD023); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .venmo-block p { color: #000; font-weight: bold; margin-bottom: 10px; }
        .venmo-block img { max-width: 160px; background: white; padding: 8px; border-radius: 8px; }
        .venmo-handle { font-size: 1.1em; font-weight: bold; color: #000; margin-top: 8px; }

        @media (max-width: 600px) { .hero h1 { font-size: 2em; } .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo"><img src="images/logo.svg" alt="V3D Creative"></div>
            <ul class="nav-links">
                <li><a href="index.html">Our Prints</a></li>
                <li><a href="inventory.html" class="active">Available Now</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </div>
    </nav>

    <div class="hero">
        <h1>Available Now</h1>
        <p>Already-printed items ready to claim. Just enter your name to hold one — then pay via Venmo.</p>
    </div>

    <div class="content">
        <div class="loading" id="loading">Loading available prints…</div>
        <div class="empty" id="empty" style="display:none;">No items available right now — check back soon!</div>
        <div class="grid" id="grid" style="display:none;"></div>
    </div>

    <!-- Claim Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modal">
            <div id="claimForm">
                <h2>Claim This Item</h2>
                <p class="item-label" id="modalItemLabel"></p>
                <label for="claimerName">Your Name</label>
                <input type="text" id="claimerName" placeholder="First and last name" autocomplete="name">
                <div class="modal-error" id="modalError"></div>
                <div class="modal-btns">
                    <button class="btn-cancel" id="btnCancel">Cancel</button>
                    <button class="btn-confirm" id="btnConfirm">Claim It</button>
                </div>
            </div>
            <div id="successBox" class="success-box" style="display:none;">
                <div class="check">✅</div>
                <h2>You're all set!</h2>
                <p id="successMsg"></p>
                <div class="venmo-block">
                    <p>Send payment to:</p>
                    <img src="images/hudson-venmo.png" alt="Venmo QR Code">
                    <div class="venmo-handle">@hudsonvastano</div>
                </div>
                <button class="btn-confirm" id="btnDone" style="width:100%;">Done</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER = 'https://v3d-orders.nicholas-vastano.workers.dev';
        let pendingItemId = null;
        let allItems = [];

        async function loadInventory() {
            try {
                const res = await fetch(`${WORKER}/inventory`);
                allItems = await res.json();
                render();
            } catch {
                document.getElementById('loading').textContent = '⚠ Could not load items. Try refreshing.';
            }
        }

        function available(item) {
            return Math.max(0, item.quantity - (item.claimed_count || 0));
        }

        function render() {
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty');
            const grid = document.getElementById('grid');
            loading.style.display = 'none';

            if (!allItems.length) { empty.style.display = 'block'; return; }
            grid.style.display = 'grid';

            grid.innerHTML = allItems.map(item => {
                const avail = available(item);
                const out = avail === 0;
                const low = avail === 1 && item.quantity > 1;
                const availText = out ? 'Claimed' : low ? '1 left' : `${avail} of ${item.quantity} left`;
                const availClass = out ? 'out' : low ? 'low' : '';
                const imgHtml = item.image_url
                    ? `<div class="card-img"><img src="${escHtml(item.image_url)}" alt="${escHtml(item.name)}"></div>`
                    : `<div class="card-img placeholder">🖨️</div>`;
                return `
                <div class="card${out ? ' sold-out' : ''}">
                    ${imgHtml}
                    <div class="card-body">
                        <div class="card-name">${escHtml(item.name)}</div>
                        ${item.description ? `<div class="card-desc">${escHtml(item.description)}</div>` : ''}
                        <div class="card-meta">
                            <span class="card-price">$${parseFloat(item.price||0).toFixed(2)}</span>
                            ${item.color ? `<span class="color-pill">${escHtml(item.color)}</span>` : ''}
                            <span class="avail-pill ${availClass}">${availText}</span>
                        </div>
                        <button class="claim-btn" ${out ? 'disabled' : ''} onclick="openClaim(${item.id})">
                            ${out ? 'Fully Claimed' : 'Claim'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function escHtml(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function openClaim(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;
            pendingItemId = id;
            document.getElementById('modalItemLabel').textContent = `${item.name}${item.color ? ' · ' + item.color : ''} — $${parseFloat(item.price||0).toFixed(2)}`;
            document.getElementById('claimerName').value = '';
            document.getElementById('modalError').textContent = '';
            document.getElementById('claimForm').style.display = 'block';
            document.getElementById('successBox').style.display = 'none';
            document.getElementById('btnConfirm').disabled = false;
            document.getElementById('btnConfirm').textContent = 'Claim It';
            document.getElementById('modalOverlay').style.display = 'flex';
            setTimeout(() => document.getElementById('claimerName').focus(), 50);
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            pendingItemId = null;
        }

        document.getElementById('btnCancel').addEventListener('click', closeModal);
        document.getElementById('btnDone').addEventListener('click', () => { closeModal(); loadInventory(); });
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        });
        document.getElementById('claimerName').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('btnConfirm').click();
        });

        document.getElementById('btnConfirm').addEventListener('click', async () => {
            const name = document.getElementById('claimerName').value.trim();
            const errEl = document.getElementById('modalError');
            errEl.textContent = '';
            if (!name) { errEl.textContent = 'Please enter your name.'; return; }

            const btn = document.getElementById('btnConfirm');
            btn.disabled = true; btn.textContent = 'Claiming…';

            try {
                const res = await fetch(`${WORKER}/claims`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inventory_id: pendingItemId, claimer_name: name }),
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error === 'No longer available' ? 'Someone just claimed the last one — sorry!' : (data.error || 'Something went wrong.');
                    btn.disabled = false; btn.textContent = 'Claim It';
                    return;
                }
                document.getElementById('claimForm').style.display = 'none';
                document.getElementById('successMsg').textContent = `${name}, your hold on "${data.item_name}" is confirmed! Pay $${parseFloat(data.price||0).toFixed(2)} via Venmo to complete your order.`;
                document.getElementById('successBox').style.display = 'block';
            } catch {
                errEl.textContent = 'Could not connect. Try again.';
                btn.disabled = false; btn.textContent = 'Claim It';
            }
        });

        loadInventory();
    </script>
</body>
</html>
