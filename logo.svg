<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 3D Cube Icon on the left -->
  <g transform="translate(20, 30)">
    <!-- Cube faces -->
    <polygon points="30,10 60,25 60,55 30,70 0,55 0,25" fill="#4CAF50" opacity="0.9"/>
    <polygon points="30,10 60,25 60,55 30,40" fill="#45a049" opacity="0.95"/>
    <polygon points="0,25 30,40 30,70 0,55" fill="#357a38" opacity="0.9"/>
    <!-- Highlight -->
    <polygon points="30,10 40,15 40,45 30,40" fill="white" opacity="0.2"/>
  </g>
  
  <!-- V3D Text -->
  <text x="110" y="75" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="56" font-weight="900" fill="url(#grad1)" filter="url(#shadow)">
    V3D
  </text>
  
  <!-- Creative Text -->
  <text x="270" y="75" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="48" font-weight="300" fill="#333" filter="url(#shadow)">
    Creative
  </text>
  
  <!-- Tagline -->
  <text x="110" y="100" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="400" fill="#666" letter-spacing="2">
    CUSTOM 3D PRINTS
  </text>
  
  <!-- Decorative line -->
  <line x1="110" y1="85" x2="540" y2="85" stroke="#4CAF50" stroke-width="2" opacity="0.3"/>
</svg>
